[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-adapter"
version = "0.1.0"
description = "Default HTTP Cave transport with retries, circuit breaker, and token-bucket limiter"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["cave_adapter*"]
